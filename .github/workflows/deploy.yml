name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Disabled npm Cache Setup: Removed the cache to prevent 'Dependencies lock file is not found' errors

      - name: Install dependencies
        run: npm install

      - name: Build Next.js Static Site
        env:
          GITHUB_ACTIONS: 'true'
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Configure Relative Paths & .nojekyll for GitHub Pages
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            let results = [];
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              file = path.join(dir, file);
              const stat = fs.statSync(file);
              if (stat && stat.isDirectory()) {
                results = results.concat(walk(file));
              } else {
                results.push(file);
              }
            });
            return results;
          }
          if (fs.existsSync('./out')) {
            const files = walk('./out');
            files.forEach(file => {
              if (file.endsWith('.html') || file.endsWith('.js') || file.endsWith('.css') || file.endsWith('.txt')) {
                let content = fs.readFileSync(file, 'utf8');
                // Replace absolute root /_next/ and /assets/ with relative ./_next/ or _next/
                content = content.replace(/\"\/_next\//g, '\"./_next/');
                content = content.replace(/\'\/_next\//g, '\'./_next/');
                content = content.replace(/\"\/assets\//g, '\"./assets/');
                content = content.replace(/\'\/assets\//g, '\'./assets/');
                content = content.replace(/href=\"\/(?!\/)/g, 'href=\"./');
                fs.writeFileSync(file, content, 'utf8');
              }
            });
            // Create .nojekyll so GitHub Pages does not ignore _next folder
            fs.writeFileSync('./out/.nojekyll', '');
            console.log('Successfully made all resource paths relative and created .nojekyll for GitHub Pages!');
          } else {
            console.error('Build output ./out was not found.');
            process.exit(1);
          }
          "

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
